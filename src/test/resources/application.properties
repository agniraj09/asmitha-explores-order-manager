# ==================================================================
# Settings used by "mvn test" - fast, isolated, in-memory H2 running in
# PostgreSQL compatibility mode. Never touches your local Postgres or Supabase.
# ==================================================================
spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:order-tracker-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.thymeleaf.cache=false

app.seed-data=false
# Never let the test suite fire requests at the deployed instance
app.self-ping.enabled=false

logging.level.org.hibernate.SQL=WARN
