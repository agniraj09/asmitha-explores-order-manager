# ==================================================================
# LOCAL profile - running & testing on your own machine
# PostgreSQL, the same engine as production, so no surprises on deploy
#   mvn spring-boot:run              (local is the default profile)
#
# One-time database setup (pick one):
#   createdb asmitha_explores        # Homebrew / native PostgreSQL install
#   docker compose up -d             # bundled docker-compose.yml
# ==================================================================

# ---------------------------- Database (local PostgreSQL) ---------------------
spring.datasource.url=jdbc:postgresql://${LOCAL_DB_HOST:localhost}:${LOCAL_DB_PORT:5432}/${LOCAL_DB_NAME:asmitha_explores}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${LOCAL_DB_USER:postgres}
spring.datasource.password=${LOCAL_DB_PASSWORD:postgres}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.pool-name=AsmithaExploresLocalPool

# ---------------------------- JPA ---------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ---------------------------- Dev conveniences --------------------------------
# Templates are reloaded without restarting the app
spring.thymeleaf.cache=false
# Seed demo customers / products / orders when the database is empty
app.seed-data=true

logging.level.com.asmithaexplores=DEBUG
