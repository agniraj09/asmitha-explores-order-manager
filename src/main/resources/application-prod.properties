# ==================================================================
# PRODUCTION profile - Supabase (PostgreSQL)
#
# Nothing secret is stored in this file: every value comes from an
# environment variable. Set them on your host (Railway / Render / Fly / VPS):
#
#   SPRING_PROFILES_ACTIVE=prod
#   SUPABASE_DB_HOST=aws-0-ap-south-1.pooler.supabase.com   <- Supabase > Project Settings > Database > Connection pooling
#   SUPABASE_DB_PORT=6543                                   <- 6543 = transaction pooler, 5432 = direct/session
#   SUPABASE_DB_NAME=postgres
#   SUPABASE_DB_USER=postgres.abcdefghijklmnop               <- "postgres.<project-ref>" when using the pooler
#   SUPABASE_DB_PASSWORD=<your database password>
#
# Or simply override the whole URL with SPRING_DATASOURCE_URL.
# ==================================================================

# ---------------------------- Database (Supabase PostgreSQL) ------------------
# sslmode=require            -> Supabase only accepts TLS connections
# prepareThreshold=0         -> required by the transaction pooler (PgBouncer)
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:6543}/${SUPABASE_DB_NAME:postgres}?sslmode=require&prepareThreshold=0
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# Supabase pooler allows a limited number of connections - keep the pool small
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=AsmithaExploresPool

# ---------------------------- JPA ---------------------------------------------
# "update" creates/extends the tables on the first deploy.
# Once the schema is stable switch to "validate" (DB_DDL_AUTO=validate).
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ---------------------------- Hardening ---------------------------------------
# No demo data in production
app.seed-data=false
# No H2 console in production
spring.h2.console.enabled=false
# Cache templates for speed
spring.thymeleaf.cache=true
# Never leak stack traces to the browser
server.error.include-stacktrace=never
server.error.include-message=never
# Needed when the app runs behind a reverse proxy / load balancer (https links)
server.forward-headers-strategy=native

# ---------------------------- Self ping ---------------------------------------
# Render's free tier spins the service down after ~15 min without traffic.
# Override the target with SELF_PING_URL if the public hostname changes.
app.self-ping.enabled=${SELF_PING_ENABLED:true}
app.self-ping.url=${SELF_PING_URL:https://asmitha-explores-order-manager.onrender.com/ping}

# ---------------------------- Logging -----------------------------------------
logging.level.root=INFO
logging.level.com.asmithaexplores=INFO
logging.level.org.hibernate.SQL=WARN

