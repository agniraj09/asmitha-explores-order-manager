<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Product form')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar(${activeTab})}"></nav>

<div class="container pb-5">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="row justify-content-center">
        <div class="col-12 col-lg-7">
            <div class="card">
                <div class="card-body">
                    <h1 class="h4 page-title mb-3" th:text="${editing} ? 'Edit product' : 'Add product'">Add product</h1>

                    <form method="post" th:action="@{/products/save}" th:object="${productForm}" novalidate>
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label" for="name">Product name</label>
                            <input id="name" type="text" class="form-control" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                error
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="category">Category</label>
                            <select id="category" class="form-select" th:field="*{category}"
                                    th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
                                <option value="">-- choose --</option>
                                <option th:each="c : ${categories}" th:value="${c}" th:text="${c}">Category</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}"
                                 th:errors="*{category}">error
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="price">Price (₹)</label>
                            <input id="price" type="number" step="0.01" min="0" inputmode="decimal"
                                   class="form-control" th:field="*{price}"
                                   th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">
                                error
                            </div>
                        </div>

                        <div class="row g-3">
                            <div class="col-6">
                                <label class="form-label" for="quantityInHand">Quantity in hand</label>
                                <input id="quantityInHand" type="number" min="0" inputmode="numeric"
                                       class="form-control"
                                       th:field="*{quantityInHand}"
                                       th:classappend="${#fields.hasErrors('quantityInHand')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('quantityInHand')}"
                                     th:errors="*{quantityInHand}">error
                                </div>
                                <div class="form-text" th:if="${editing}">
                                    Increasing this settles the same number of units from
                                    &quot;to be ordered&quot;, unless you change that field too.
                                </div>
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="quantityToBeOrdered">Quantity to be ordered</label>
                                <input id="quantityToBeOrdered" type="number" min="0" inputmode="numeric"
                                       class="form-control"
                                       th:field="*{quantityToBeOrdered}"
                                       th:classappend="${#fields.hasErrors('quantityToBeOrdered')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('quantityToBeOrdered')}"
                                     th:errors="*{quantityToBeOrdered}">error
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button class="btn btn-primary flex-fill flex-lg-grow-0" type="submit">Save</button>
                            <a class="btn btn-outline-secondary flex-fill flex-lg-grow-0"
                               th:href="@{/products}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
