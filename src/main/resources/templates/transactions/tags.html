<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Transaction tags')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar(${activeTab})}"></nav>

<div class="container pb-5">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3 page-header">
        <div>
            <h1 class="h3 page-title mb-0">Transaction tags</h1>
            <small class="text-muted">Segregate money by what it was for - flash cards, banners, courier ...</small>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/transactions}">
            <i class="bi bi-arrow-left"></i> Back to finance</a>
    </div>

    <div class="row g-3">
        <div class="col-12 col-lg-5">
            <div class="card">
                <div class="card-body">
                    <h2 class="h5 page-title mb-3"
                        th:text="${tagForm.id != null} ? 'Edit tag' : 'Add tag'">Add tag</h2>

                    <form method="post" th:action="@{/transactions/tags/save}" th:object="${tagForm}" novalidate>
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label" for="name">Tag name</label>
                            <input id="name" type="text" class="form-control" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                   placeholder="e.g. Flash Cards">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}"
                                 th:errors="*{name}">error
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="colorHex">Colour</label>
                            <input id="colorHex" type="color" class="form-control form-control-color"
                                   th:field="*{colorHex}"
                                   th:classappend="${#fields.hasErrors('colorHex')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('colorHex')}"
                                 th:errors="*{colorHex}">error
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="description">Description</label>
                            <input id="description" type="text" class="form-control" th:field="*{description}"
                                   th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}"
                                 th:errors="*{description}">error
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button class="btn btn-primary flex-fill flex-lg-grow-0" type="submit">Save</button>
                            <a class="btn btn-outline-secondary flex-fill flex-lg-grow-0"
                               th:if="${tagForm.id != null}" th:href="@{/transactions/tags}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-7">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>All tags</span>
                    <span class="text-muted small"><span th:text="${#lists.size(tags)}">0</span> tag(s)</span>
                </div>
                <div class="table-responsive table-stack-wrap">
                    <table class="table table-hover table-stack align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Tag</th>
                            <th>Description</th>
                            <th class="text-end">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="tag : ${tags}">
                            <td class="cell-title" data-label="Tag">
                                <span class="badge tag-pill"
                                      th:style="${tag.colorHex != null} ? 'color:' + ${tag.colorHex} + '; border-color:' + ${tag.colorHex} + ';' : null"
                                      th:text="${tag.name}">Tag</span>
                            </td>
                            <td data-label="Description" th:text="${tag.description} ?: '—'">—</td>
                            <td class="text-end text-nowrap cell-actions">
                                <a class="btn btn-sm btn-outline-secondary"
                                   th:href="@{'/transactions/tags/' + ${tag.id} + '/edit'}">Edit</a>
                                <form class="d-inline" method="post" th:unless="${tag.inUse}"
                                      th:action="@{'/transactions/tags/' + ${tag.id} + '/delete'}"
                                      onsubmit="return confirm('Delete this tag?');">
                                    <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                                </form>
                                <span class="badge text-bg-light" th:if="${tag.inUse}">in use</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(tags)}">
                            <td colspan="3" class="text-center text-muted py-4">No tags yet.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
