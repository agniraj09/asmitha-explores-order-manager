# ==================================================================
# Asmitha Explores - Order Tracker : COMMON settings
# Profile specific settings live in:
#   application-local.properties  (H2 file DB - running/testing on your laptop)
#   application-prod.properties   (Supabase PostgreSQL)
# The active profile defaults to "local" and can be overridden with
#   -Dspring-boot.run.profiles=prod      (mvn spring-boot:run)
#   --spring.profiles.active=prod        (java -jar)
#   SPRING_PROFILES_ACTIVE=prod          (environment variable)
# ==================================================================
spring.application.name=asmitha-explores-order-tracker
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${PORT:8080}

# ---------------------------- JPA (common) ------------------------------------
spring.jpa.open-in-view=false
# Load the eager associations (order items, their product, the customer) of a whole
# result set with a handful of "... in (?, ?, ...)" selects instead of one select per
# row. Without this every list page costs one round trip per order, which is painfully
# slow against a hosted database.
spring.jpa.properties.hibernate.default_batch_fetch_size=200

# ---------------------------- Application settings ----------------------------
app.shop-name=Asmitha Explores
# Courier tracking page shared with customers on WhatsApp. Can be overridden per order in the UI.
app.tracking-url=${TRACKING_URL:https://franchexpress.com/courier-tracking/}

# ---------------------------- Automatic delivery detection --------------------
# Shipped orders carry a tracking id, so the courier is asked about them on a timer
# and an order moves to DELIVERED on its own once the parcel is handed over.
# The "Check courier status now" button on the order page works regardless of this flag.
app.tracking.auto-sync-enabled=${TRACKING_AUTO_SYNC:true}
app.tracking.api-url=${TRACKING_API_URL:https://franchexpress.com/proxy.php}
# Interval, first-run delay and the pause between two lookups, in milliseconds
# 21600000 ms = 6 hours - a parcel does not change state any faster than that
app.tracking.interval-ms=${TRACKING_SYNC_INTERVAL_MS:21600000}
app.tracking.initial-delay-ms=${TRACKING_SYNC_INITIAL_DELAY_MS:120000}
app.tracking.request-delay-ms=1000
# Orders shipped longer ago than this are no longer polled
app.tracking.max-age-days=6

# ---------------------------- Self ping ---------------------------------------
# Free hosting tiers idle the container out after a period without traffic.
# When enabled the app calls its own /ping endpoint to stay warm.
# Disabled by default: only the deployed (prod) instance should do this.
app.self-ping.enabled=false
app.self-ping.url=${SELF_PING_URL:http://localhost:${PORT:8080}/ping}
# Interval + initial delay in milliseconds
app.self-ping.interval=${SELF_PING_INTERVAL_MS:600000}
app.self-ping.initial-delay=60000

# ---------------------------- Web / templates ---------------------------------
spring.mvc.format.date=iso
server.error.whitelabel.enabled=false

# Emoji in the WhatsApp message are 4-byte UTF-8. Containers often start with an
# ASCII default charset, so pin UTF-8 instead of inheriting the platform default.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.thymeleaf.encoding=UTF-8

# Keep the session id in a cookie only. Without this Tomcat rewrites URLs as
# "/;jsessionid=..." on the first request, which breaks redirects to "/".
server.servlet.session.tracking-modes=cookie

