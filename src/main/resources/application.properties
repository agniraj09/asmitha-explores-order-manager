# ==================================================================
# Asmitha Explores - Order Tracker : COMMON settings
# Profile specific settings live in:
#   application-local.properties  (H2 file DB - running/testing on your laptop)
#   application-prod.properties   (Supabase PostgreSQL)
# The active profile defaults to "local" and can be overridden with
#   -Dspring-boot.run.profiles=prod      (mvn spring-boot:run)
#   --spring.profiles.active=prod        (java -jar)
#   SPRING_PROFILES_ACTIVE=prod          (environment variable)
# ==================================================================
spring.application.name=asmitha-explores-order-tracker
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${PORT:8080}

# ---------------------------- JPA (common) ------------------------------------
spring.jpa.open-in-view=false

# ---------------------------- Application settings ----------------------------
app.shop-name=Asmitha Explores

# ---------------------------- Web / templates ---------------------------------
spring.mvc.format.date=iso
server.error.whitelabel.enabled=false

# Keep the session id in a cookie only. Without this Tomcat rewrites URLs as
# "/;jsessionid=..." on the first request, which breaks redirects to "/".
server.servlet.session.tracking-modes=cookie

