# Local PostgreSQL for development:  docker compose up -d
# Matches the defaults in application-local.properties.
services:
  postgres:
    image: postgres:16-alpine
    container_name: asmitha-explores-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: asmitha_explores
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - asmitha-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asmitha_explores"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  asmitha-pgdata:

